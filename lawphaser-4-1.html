<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LawPhaser — Law school, but easier.</title>
  <meta name="description" content="LawPhaser is a legal education platform for Nigerian law students, founded by Victoria Ordia.">
<meta name="author" content="Victoria Ordia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#16152B;
  --ink-soft:#3A3854;
  --paper:#FAF6EC;
  --paper-raised:#FFFFFF;
  --paper-line:#E5DCC3;
  --gold:#C79A2E;
  --gold-deep:#9C7A1F;
  --emerald:#1F6E52;
  --emerald-deep:#164F3B;
  --berry:#B23A48;
  --sky:#2C5C8A;
  --shadow: 0 1px 0 rgba(22,21,43,0.04);
  --radius: 14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Manrope',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4,.display{
  font-family:'Fraunces',serif;
  font-weight:600;
  color:var(--ink);
  letter-spacing:-0.01em;
  margin:0;
}
p{line-height:1.6;color:var(--ink-soft);margin:0 0 1em 0;max-width:65ch;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--gold);color:#fff;}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;}

/* ---------- shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--ink);
  color:#EFEAD9;
  border-bottom:3px solid var(--gold);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:12px 24px;
  display:flex;align-items:center;gap:24px;
}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.25rem;color:#fff;cursor:pointer;flex-shrink:0;}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--gold),#8A6A1B);
  display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:15px;font-weight:800;
}
.nav-desktop{display:flex;gap:2px;flex:1;flex-wrap:wrap;}
.nav-desktop button{
  background:none;border:none;color:#CFC9B0;font-size:0.86rem;font-weight:600;padding:8px 12px;border-radius:8px;
}
.nav-desktop button:hover, .nav-desktop button.active{background:rgba(255,255,255,0.08);color:#fff;}
.top-actions{display:flex;gap:10px;align-items:center;}
.searchbox{
  display:flex;align-items:center;background:rgba(255,255,255,0.08);border-radius:20px;padding:6px 12px;gap:6px;
}
.searchbox input{background:none;border:none;color:#fff;font-size:0.82rem;width:130px;font-family:inherit;}
.searchbox input::placeholder{color:#9B9680;}
.searchbox input:focus{outline:none;}
.pill-btn{
  background:var(--gold);color:var(--ink);border:none;padding:8px 16px;border-radius:20px;font-weight:700;font-size:0.82rem;
}
.pill-btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,0.35);color:#fff;}
.avatar-chip{
  width:34px;height:34px;border-radius:50%;background:var(--emerald);color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:0.85rem;flex-shrink:0;
}
.mobile-nav{display:none;position:sticky;bottom:0;z-index:50;background:var(--ink);border-top:1px solid rgba(255,255,255,0.12);padding:6px 4px 10px;}
.mobile-nav-inner{display:flex;justify-content:space-around;}
.mobile-nav button{background:none;border:none;color:#CFC9B0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:0.62rem;font-weight:700;padding:6px 4px;border-radius:10px;}
.mobile-nav button.active{color:var(--gold);}
.mobile-nav .icon{font-size:1.15rem;}

main{flex:1;}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
.section{padding:56px 0;}
.section.tight{padding:32px 0;}

/* ---------- landing ---------- */
.hero{
  background:
    radial-gradient(ellipse 900px 500px at 85% -10%, rgba(199,154,46,0.18), transparent 60%),
    radial-gradient(ellipse 700px 500px at -10% 10%, rgba(31,110,82,0.16), transparent 60%),
    var(--ink);
  color:#F3EFDF;position:relative;overflow:hidden;
}
.hero-inner{max-width:1180px;margin:0 auto;padding:88px 24px 70px;position:relative;z-index:2;}
.hero-eyebrow{font-size:0.78rem;letter-spacing:0.02em;color:var(--gold);font-weight:700;margin-bottom:18px;font-family:'Fraunces',serif;font-style:italic;}
.hero h1{font-size:clamp(2.6rem,6vw,4.4rem);line-height:1.02;color:#fff;max-width:14ch;}
.hero .tagline{font-size:clamp(1.05rem,2vw,1.35rem);color:#D9D3BC;margin-top:20px;max-width:38ch;font-family:'Fraunces',serif;font-style:italic;font-weight:500;}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px;}
.btn{
  border:none;padding:13px 22px;border-radius:10px;font-weight:700;font-size:0.92rem;display:inline-flex;align-items:center;gap:8px;
}
.btn-primary{background:var(--gold);color:var(--ink);}
.btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,0.32);color:#fff;}
.btn-emerald{background:var(--emerald);color:#fff;}
.btn-ink{background:var(--ink);color:#fff;}
.hero-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(255,255,255,0.14);margin-top:64px;border-radius:16px;overflow:hidden;position:relative;z-index:2;}
.hero-strip>div{background:rgba(255,255,255,0.04);padding:20px 16px;}
.hero-strip .num{font-family:'Fraunces',serif;font-size:1.6rem;color:var(--gold);font-weight:700;}
.hero-strip .lbl{font-size:0.76rem;color:#C7C2AC;margin-top:4px;}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
.section-head h2{font-size:1.9rem;}
.section-head .kicker{font-family:'Fraunces',serif;font-style:italic;color:var(--emerald-deep);font-size:0.95rem;margin-bottom:6px;}
.section-sub{color:var(--ink-soft);max-width:60ch;}

.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.feature-card{
  background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:var(--radius);padding:24px;
  display:flex;flex-direction:column;gap:10px;transition:transform .15s ease, box-shadow .15s ease;
}
.feature-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(22,21,43,0.09);}
.feature-card .ic{font-size:1.6rem;}
.feature-card h3{font-size:1.08rem;}
.feature-card p{font-size:0.9rem;margin:0;}
.feature-card .go{margin-top:auto;font-size:0.82rem;font-weight:700;color:var(--emerald-deep);}

.landing-band{background:var(--emerald);color:#fff;padding:44px 0;}
.landing-band .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.landing-band h2{color:#fff;font-size:1.7rem;max-width:22ch;}
.landing-band p{color:#D9EDE3;}

footer{background:var(--ink);color:#B7B29A;padding:36px 0;font-size:0.8rem;}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}

/* ---------- cards / generic ---------- */
.card{background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:var(--radius);}
.badge{display:inline-block;font-size:0.68rem;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:0.02em;}
.badge-gold{background:#F3E4B8;color:var(--gold-deep);}
.badge-emerald{background:#D8ECE2;color:var(--emerald-deep);}
.badge-berry{background:#F3D9DB;color:var(--berry);}
.badge-sky{background:#DCE7F2;color:var(--sky);}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}

.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.folder{
  background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:12px;padding:20px;position:relative;
  border-top:5px solid var(--course-color, var(--gold));
}
.folder h3{font-size:1.05rem;margin-bottom:6px;}
.folder .meta{font-size:0.78rem;color:var(--ink-soft);}
.folder .progress-bar{height:6px;border-radius:4px;background:var(--paper-line);margin-top:14px;overflow:hidden;}
.folder .progress-bar>div{height:100%;background:var(--course-color,var(--gold));}

.tabs{display:flex;gap:6px;border-bottom:2px solid var(--paper-line);margin-bottom:24px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:10px 14px;font-weight:700;font-size:0.86rem;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tabs button.active{color:var(--ink);border-bottom-color:var(--gold);}

.block{padding:22px 24px;margin-bottom:16px;}
.block h4{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold-deep);font-weight:800;margin-bottom:10px;}
.block .body-text{color:var(--ink);font-size:0.97rem;line-height:1.7;}
.block ul{margin:0;padding-left:20px;color:var(--ink);}
.block li{margin-bottom:6px;line-height:1.55;}

.evidence-btn{
  display:inline-flex;align-items:center;gap:5px;background:#EFE3C4;color:var(--gold-deep);border:1px solid #DCC488;
  padding:3px 10px;border-radius:14px;font-size:0.72rem;font-weight:800;margin-left:6px;
}
.evidence-chain{display:flex;flex-direction:column;gap:0;margin-top:14px;}
.evidence-chain .ev-step{
  display:flex;gap:14px;padding:12px 0;border-left:2px solid var(--paper-line);padding-left:18px;position:relative;
}
.evidence-chain .ev-step::before{content:'';position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--gold);}
.evidence-chain .ev-step .ev-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold-deep);font-weight:800;}
.evidence-chain .ev-step .ev-val{font-size:0.92rem;color:var(--ink);margin-top:3px;}

.case-card{border:1px solid var(--paper-line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--paper-raised);cursor:pointer;transition:box-shadow .15s;}
.case-card:hover{box-shadow:0 8px 20px rgba(22,21,43,0.08);}
.case-card .cname{font-family:'Fraunces',serif;font-weight:600;font-size:1.02rem;}
.case-card .cmeta{font-size:0.78rem;color:var(--ink-soft);margin-top:2px;}

.detail-panel{position:fixed;inset:0;background:rgba(22,21,43,0.55);z-index:100;display:flex;justify-content:flex-end;}
.detail-panel .sheet{background:var(--paper);width:min(640px,100%);height:100%;overflow-y:auto;padding:28px;box-shadow:-10px 0 40px rgba(0,0,0,0.25);}
.detail-panel.hidden{display:none;}
.sheet-close{background:var(--ink);color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:1rem;float:right;}
.ratio-box{background:#FBF3DA;border:1px solid #E7D394;border-radius:10px;padding:14px 16px;margin:10px 0;}
.ratio-box .rl{font-size:0.68rem;text-transform:uppercase;font-weight:800;color:var(--gold-deep);}

/* flashcards */
.deck-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
.flip-card{width:100%;max-width:520px;height:270px;perspective:1400px;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.flip-front{background:var(--ink);color:#fff;}
.flip-back{background:var(--emerald);color:#fff;transform:rotateY(180deg);}
.flip-face .fk{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.08em;opacity:0.65;font-weight:700;margin-bottom:14px;}
.flip-face .ftext{font-family:'Fraunces',serif;font-size:1.2rem;line-height:1.5;}
.deck-controls{display:flex;gap:10px;}
.deck-controls button{border-radius:10px;padding:10px 18px;font-weight:700;font-size:0.86rem;border:none;}
.deck-progress{font-size:0.8rem;color:var(--ink-soft);}

/* quiz */
.q-option{display:block;width:100%;text-align:left;padding:13px 16px;border:1.5px solid var(--paper-line);border-radius:10px;margin-bottom:10px;background:var(--paper-raised);font-size:0.92rem;}
.q-option:hover{border-color:var(--gold);}
.q-option.correct{border-color:var(--emerald);background:#E4F2EA;}
.q-option.wrong{border-color:var(--berry);background:#F7E6E7;}
.q-option[disabled]{cursor:default;}

/* maxim cards */
.maxim-card{background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:12px;padding:20px;}
.maxim-card .lat{font-family:'Fraunces',serif;font-style:italic;font-size:1.15rem;color:var(--emerald-deep);}
.maxim-card .fav{float:right;background:none;border:none;font-size:1.1rem;}

/* career */
.career-tag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.career-tile{border:1px solid var(--paper-line);background:var(--paper-raised);border-radius:12px;padding:16px;text-align:left;}
.career-tile:hover{border-color:var(--gold);}
.career-tile .ic{font-size:1.4rem;}
.career-tile h4{font-size:0.95rem;margin-top:6px;}

.demo-banner{background:#FBF3DA;border:1px dashed #D8B95A;border-radius:12px;padding:14px 18px;font-size:0.84rem;color:#6B531A;margin-bottom:22px;}

.status-open{color:var(--emerald-deep);font-weight:800;}
.status-soon{color:var(--gold-deep);font-weight:800;}
.status-closed{color:var(--berry);font-weight:800;}

.opp-card{border:1px solid var(--paper-line);border-radius:12px;padding:18px;margin-bottom:12px;background:var(--paper-raised);}
.opp-card .top-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}

.reminder-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.reminder-card{border-radius:14px;padding:20px;color:#fff;}
.reminder-card h4{color:#fff;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;opacity:0.8;margin-bottom:8px;}
.reminder-card p{color:#fff;font-size:0.95rem;margin:0;}

.progress-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.pstat{border:1px solid var(--paper-line);border-radius:12px;padding:16px;text-align:center;background:var(--paper-raised);}
.pstat .n{font-family:'Fraunces',serif;font-size:1.7rem;color:var(--emerald-deep);}
.pstat .l{font-size:0.74rem;color:var(--ink-soft);margin-top:4px;}

.checklist label{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--paper-line);font-size:0.9rem;}
.checklist input{width:17px;height:17px;accent-color:var(--emerald);}

.form-row{margin-bottom:16px;}
.form-row label{display:block;font-size:0.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.form-row input,.form-row select,.form-row textarea{
  width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--paper-line);font-family:inherit;font-size:0.93rem;background:#fff;
}
.form-row textarea{min-height:110px;resize:vertical;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:2.2rem;margin-bottom:10px;}

.search-results-group{margin-bottom:26px;}
.search-results-group h3{font-size:1rem;margin-bottom:10px;color:var(--emerald-deep);}
.result-row{padding:11px 0;border-bottom:1px solid var(--paper-line);cursor:pointer;}
.result-row:hover .rtitle{color:var(--emerald-deep);}
.result-row .rtitle{font-weight:700;font-size:0.94rem;}
.result-row .rsub{font-size:0.78rem;color:var(--ink-soft);}

.sticky-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.sticky{border-radius:10px;padding:16px;font-size:0.88rem;min-height:120px;position:relative;box-shadow:0 3px 10px rgba(0,0,0,0.08);}
.sticky button{position:absolute;top:8px;right:10px;background:none;border:none;font-size:0.9rem;opacity:0.6;}

.next-block{background:var(--ink);color:#fff;border-radius:16px;padding:28px;margin-top:30px;}
.next-block h4{color:#fff;font-family:'Fraunces',serif;font-size:1.2rem;margin-bottom:14px;}
.next-block .checklist label{color:#EDE8D4;border-bottom-color:rgba(255,255,255,0.14);}
.next-block .next-recs{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

.timer-badge{background:var(--berry);color:#fff;padding:6px 14px;border-radius:20px;font-weight:800;font-size:0.9rem;}

.install-strip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:30px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,0.3);z-index:60;}
.install-strip button.pill-btn{padding:8px 16px;}
.install-strip.hidden{display:none;}

@media(max-width:880px){
  .nav-desktop,.top-actions{display:none;}
  .mobile-nav{display:block;}
  .feature-grid{grid-template-columns:1fr 1fr;}
  .hero-strip{grid-template-columns:repeat(2,1fr);}
  .landing-band .wrap{flex-direction:column;align-items:flex-start;}
  .reminder-strip{grid-template-columns:1fr;}
  .detail-panel .sheet{width:100%;}
}
@media(max-width:520px){
  .feature-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================= DATA ============================= */

const LATIN = [
 {m:"Res judicata", mean:"A matter already judged", plain:"Once a court finally decides an issue between two parties, it cannot be re-litigated between them again — case closed, no rematch.", area:"Evidence Law", ex:"Two brothers already fought over a plot in Warri and the court ruled for one of them. Ten years later their children try the same suit over the same plot — the court throws it out.", trick:"Judged once, judged for good."},
 {m:"Interest reipublicae ut sit finis litium", mean:"It is in the public interest that lawsuits have an end", plain:"The whole justification for res judicata — society benefits when disputes eventually end rather than dragging on forever.", area:"Evidence Law", ex:"Courts won't let old, settled disputes be reopened simply because someone is unhappy with the outcome.", trick:"Litigation must die a natural death."},
 {m:"Jus accrescendi", mean:"Right of accretion / growth", plain:"The fancy name for right of survivorship in joint tenancy — when one joint owner dies, their share automatically merges into the surviving owners' shares.", area:"Land Law", ex:"Musa, Ada and Chidi are joint tenants. Musa dies — his share flows straight to Ada and Chidi, no matter what his will says.", trick:"The share 'grows' into the survivors."},
 {m:"Animus possidendi", mean:"Intention to possess", plain:"A requirement for adverse possession — you must genuinely intend to treat the land as your own, not just pass through it casually.", area:"Land Law", ex:"Farming a plot for decades as if it were yours, not merely crossing it to reach somewhere else.", trick:"Mind of an owner, not a visitor."},
 {m:"Profit à prendre", mean:"Profit to take", plain:"A right to physically take something — fish, timber, minerals, crops — from someone else's land.", area:"Land Law", ex:"Villagers gathering firewood or fishing on communal land under custom.", trick:"You don't just walk on it — you walk away with something."},
 {m:"Pur autre vie", mean:"For the life of another", plain:"A life estate measured by the life of someone other than the estate holder — 'to A for the life of B'.", area:"Land Law", ex:"A keeps the land only until B dies, even if A is still alive.", trick:"Your time on the land is borrowed from someone else's lifespan."},
 {m:"Per incuriam", mean:"Through lack of care", plain:"A decision made carelessly, without considering a relevant law or precedent — it doesn't create solid precedent and doesn't bind res judicata.", area:"Evidence Law / Trusts", ex:"A judgment that overlooked a governing statute can later be disregarded as per incuriam.", trick:"Careless ruling, no binding power."},
 {m:"In limine", mean:"At the threshold", plain:"Dismissed right at the outset — before the real evidence or issues were ever examined.", area:"Evidence Law", ex:"A suit thrown out on a technical objection before trial even begins.", trick:"Struck down at the door."},
 {m:"Prima facie", mean:"At first sight", plain:"Evidence that looks sufficient on its face, strong enough to require the other side to respond, unless later disproved.", area:"Evidence Law", ex:"A prima facie case of theft is enough to put the accused to their defence.", trick:"Good enough at first glance."},
 {m:"Mutatis mutandis", mean:"With the necessary changes made", plain:"A rule applies to a new situation with only the small adjustments needed to fit it.", area:"Evidence Law", ex:"The rule for computer evidence applies to website printouts, mutatis mutandis.", trick:"Same rule, small tweak."},
 {m:"Inter vivos", mean:"Between the living", plain:"A transfer of property made while both parties are alive, unlike a transfer that only takes effect after death.", area:"Land Law", ex:"A gift of land handed over while the giver is still alive.", trick:"Living hand to living hand."},
 {m:"Locus standi", mean:"Place of standing", plain:"Your legal right to be heard in court — whether it is your own right that is affected, not just the public's.", area:"Constitutional / Environmental Law", ex:"Adesanya v President of Nigeria refused a claim brought merely as a concerned citizen.", trick:"No seat at the table, no case."},

     concept:"Liability for a stranger who HELPS a trustee commit a breach of trust — even without receiving a kobo themselves, just holding the door open.",
     law:[
      "Barnes v Addy (Lord Selborne) originally required the trustee's breach to be fraudulent before a stranger-helper could be liable.",

      "Millett J's view: the standard 'reasonable person' is paranoid and thorough in land deals, but relaxed in ordinary business — an agent is 'not expected to be unduly suspicious' and is only liable for failing to ask further questions where an honest, reasonable person would have realised the money was probably being misapplied."

let adminTopicsMerged = false;
async function loadAdminTopics(){
  if(!sb) return;
  const { data, error } = await sb.from('admin_topics').select('*').order('created_at',{ascending:true});
  if(error || !data) return;
  // remove any previously-merged admin topics before re-merging (so refresh doesn't duplicate)
  COURSES.forEach(c=>{ c.topics = c.topics.filter(t=>!t.__admin); });
  data.forEach(row=>{
    const c = COURSES.find(x=>x.id===row.course_id);
    if(!c) return;
    const cases = (row.cases||[]).map((cs,idx)=>({ ...cs, id: row.id+'-case-'+idx }));
    const topic = {
      id: row.id, title: row.title, __admin:true,
      concept: row.concept||"", law: row.law||[], statute: row.statute||"",
      cases,
      evidence: { principle: row.concept||row.title, chain: [row.statute, ...cases.map(cs=>('Case: '+cs.name))].filter(Boolean) },
      flashcards: row.flashcards||[],
      problem: { scenario: row.problem_scenario||"No problem question added for this topic yet.", ask: row.problem_ask||"Check back soon." },
      quiz: (row.quiz||[]).map(q=>({ q:q.q, options:q.options, a:q.a })),
      video: row.video_url? { url: row.video_url, title: row.video_title||row.title } : null
    };
    c.topics.push(topic);
    cases.forEach(cs=>{ CASES_INDEX[cs.id] = {course:c.id, topic:topic.id}; });
  });
}

let persistTimer = null;
function persistState(){
  if(!sb || !state.profile) return;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(async ()=>{
    try{
      const { data:{ user } } = await sb.auth.getUser();
      if(!user) return;
      await sb.from('progress').update({ data: state.progress, updated_at: new Date().toISOString() }).eq('user_id', user.id);
      await sb.from('user_content').update({ data: { notes: state.notes, favMaxims: state.favMaxims, irac: state.irac, flashKnown: state.flashKnown }, updated_at: new Date().toISOString() }).eq('user_id', user.id);
    }catch(e){ console.error("LawPhaser sync failed:", e); }
  }, 700);
}

function todaySeed(){
  const d = new Date();
  return d.getFullYear()*372 + (d.getMonth()+1)*31 + d.getDate();
}
function pick(arr){ return arr[todaySeed() % arr.length]; }
function pickCaseOfDay(){
  const all=[];
  COURSES.forEach(c=>c.topics.forEach(t=>t.cases.forEach(cs=>all.push({...cs,course:c.id,topic:t.id,courseName:c.name}))));
  return all.length? all[todaySeed()%all.length] : null;
}

  const words=[
    {w:"Estoppel", d:"A rule stopping a person from denying a fact they earlier led someone else to rely on.", area:"Evidence Law", trick:"You can't talk from both sides of your mouth."},
    {w:"Fiduciary", d:"Someone who owes another a duty of loyalty and good faith — trusted with your interests, not allowed to self-deal.", area:"Equity & Trusts", trick:"Trust me, but I'm legally bound not to betray you."},
    {w:"Easement", d:"A right to use someone else's land in a specific way, without owning any part of it.", area:"Land Law", trick:"Use it, don't own it."},
    {w:"Res judicata", d:"Once a court has finally decided a matter, it can't be relitigated between the same parties.", area:"Evidence Law", trick:"Case closed, no rematch."},
    {w:"Unconscionable", d:"So unfair, given all the circumstances, that the law will not allow it to stand.", area:"Equity & Trusts", trick:"Against conscience, against the law."}
  ];
  return pick(words);
}
function dailyReminder(){
  const r=[
    "Do not merely state the law. Apply it to the facts.",
    "Always identify the issue before discussing the rule.",
    "Know your cases. Understand your cases. Don't just memorise names.",
    "A legal argument is stronger when you support it with authority.",
    "In problem questions, structure beats memory — IRAC first, detail second."
  ];
  return pick(r);
}

function findTopic(courseId, topicId){
  const c = COURSES.find(x=>x.id===courseId);
  if(!c) return null;
  const t = c.topics.find(x=>x.id===topicId);
  return t? {course:c, topic:t} : null;
}
function findCase(caseId){
  const loc = CASES_INDEX[caseId];
  if(!loc) return null;
  const {course,topic} = findTopic(loc.course, loc.topic);
  const cs = topic.cases.find(x=>x.id===caseId);
  return {course, topic, cs};
}
function allTopicsFlat(){
  const arr=[];
  COURSES.forEach(c=>c.topics.forEach(t=>arr.push({course:c,topic:t})));
  return arr;
}
function totalTopics(){ return allTopicsFlat().length; }
function completedCount(){ return Object.keys(state.progress.topicsCompleted).length; }

async function submitOnboard(){
  const email = document.getElementById("ob-cred-email").value.trim();
  const pass = document.getElementById("ob-cred-pass").value;
  const name = document.getElementById("ob-name").value.trim();
  const uni = document.getElementById("ob-uni").value.trim() || "Your university";
  const level = document.getElementById("ob-level").value;
  const faculty = document.getElementById("ob-faculty").value.trim() || "Faculty of Law";
  state.authError = "";
  if(!name){ state.authError = "Please enter your name to continue."; render(); return; }

  if(!SUPABASE_READY){
    // Local/demo fallback — matches the app's original behaviour, no persistence.
    state.profile = { name, uni, level, faculty, email };
    nav("#/dashboard");
    return;
  }

  if(!email || !pass || pass.length < 6){ state.authError = "Enter a valid email and a password of at least 6 characters."; render(); return; }
  state.authBusy = true; render();
  try{
    const { data, error } = await sb.auth.signUp({ email, password: pass });
    if(error) throw error;
    // Row in profiles/progress/user_content is auto-created by the DB trigger (see setup.sql) —
    // now fill in the fields from this form.
    const userId = data.user ? data.user.id : (data.session ? data.session.user.id : null);
    if(userId){
      await sb.from('profiles').update({ name, university: uni, level, faculty, email }).eq('id', userId);
    }
    state.profile = { name, uni, level, faculty, email };
    state.authBusy = false;
    if(!data.session){
      // Email confirmation is required by this Supabase project's settings.
      state.authError = "";
      alert("Account created. Please check your email to confirm your address, then sign in.");
      nav("#/signin");
      return;
    }
    await loadProgressFromDB(); await loadUserContentFromDB(); await loadAdminTopics();
    nav("#/dashboard");
  }catch(e){
    state.authBusy = false;
    state.authError = e.message || "Something went wrong creating your account.";
    render();
  }
}

/* ---------------- TOPIC ---------------- */
function viewTopic(courseId, topicId, tab){
  const found = findTopic(courseId, topicId);
  if(!found) return `<div class="section"><div class="wrap">Topic not found.</div></div>`;
  const {course:c, topic:t} = found;
  const tabs = [["concept","Concept & Law"],["cases","Cases"],["evidence","Evidence"],["flashcards","Flashcards"],["problem","Problem Question"],["quiz","Quiz"],["next","What Next?"]];
  let content = "";
  if(tab==="concept") content = topicConceptTab(c,t);
  else if(tab==="cases") content = topicCasesTab(c,t);
  else if(tab==="evidence") content = topicEvidenceTab(c,t);
  else if(tab==="flashcards") content = topicFlashcardsTab(c,t);
  else if(tab==="problem") content = topicProblemTab(c,t);
  else if(tab==="quiz") content = topicQuizTab(c,t);
  else if(tab==="next") content = topicNextTab(c,t);

  return `<div class="section"><div class="wrap">
    <div class="kicker" style="color:${c.color}">${c.icon} ${c.name}</div>
    <h2 style="font-size:1.7rem;">${t.title}</h2>
    <div class="tabs">
      ${tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="nav('#/topic/${c.id}/${t.id}/${id}')">${label}</button>`).join("")}
    </div>
    ${content}
  </div></div>`;
}

function topicFlashcardsTab(c,t){
  const deckKey = c.id+'/'+t.id;
  if(state.flashDeckKey !== deckKey){ state.flashDeckKey = deckKey; state.flashIndex = 0; state.flashFlipped=false; }
  const cards = t.flashcards;
  if(cards.length===0) return `<div class="empty-state"><div class="ic">🧠</div>No flashcards yet for this topic.</div>`;
  const i = state.flashIndex % cards.length;
  const card = cards[i];
  const knownKey = deckKey+'/'+i;
  return `<div class="deck-wrap">
    <div class="deck-progress">Card ${i+1} of ${cards.length}${state.flashKnown[knownKey]?' · marked known':''}</div>
    <div class="flip-card ${state.flashFlipped?'flipped':''}" onclick="flipCard()">
      <div class="flip-inner">
        <div class="flip-face flip-front"><div class="fk">Front</div><div class="ftext">${card.f}</div></div>
        <div class="flip-face flip-back"><div class="fk">Back</div><div class="ftext">${card.b}</div></div>
      </div>
    </div>
    <div class="deck-controls">
      <button style="background:var(--paper-line);" onclick="prevCard()">← Prev</button>
      <button style="background:var(--berry);color:#fff;" onclick="markCard(false)">Review again</button>
      <button style="background:var(--emerald);color:#fff;" onclick="markCard(true)">I know this</button>
      <button style="background:var(--paper-line);" onclick="nextCard()">Next →</button>
    </div>
  </div>`;
}
function flipCard(){ state.flashFlipped = !state.flashFlipped; render(); }
function nextCard(){ const t=currentTopicFromDeck(); state.flashIndex=(state.flashIndex+1)%t.flashcards.length; state.flashFlipped=false; render(); }
function prevCard(){ const t=currentTopicFromDeck(); state.flashIndex=(state.flashIndex-1+t.flashcards.length)%t.flashcards.length; state.flashFlipped=false; render(); }
function markCard(known){
  const key = state.flashDeckKey+'/'+state.flashIndex;
  state.flashKnown[key]=known;
  if(known){ state.progress.flashMastered[key]=true; }
  persistState();
  nextCard();
}
function currentTopicFromDeck(){
  const [cid,tid] = state.flashDeckKey.split('/');
  return findTopic(cid,tid).topic;
}

function topicProblemTab(c,t){
  const key = c.id+'/'+t.id;
  const saved = state.irac[key] || {i:"",r:"",a:"",co:""};
  return `<div class="card block">
    <h4>Problem Question</h4>
    <div class="body-text">${t.problem.scenario}</div>
    <div class="ratio-box"><div class="rl">Task</div>${t.problem.ask}</div>
  </div>
  <div class="card block">
    <h4>IRAC Answer Mode</h4>
    <p style="font-size:0.85rem;">Structure your answer as Issue → Rule → Application → Conclusion, then compare against a strong-answer checklist.</p>
    <div class="form-row"><label>I — Issue</label><textarea id="irac-i" placeholder="What legal question does this scenario raise?">${saved.i}</textarea></div>
    <div class="form-row"><label>R — Rule</label><textarea id="irac-r" placeholder="What is the applicable law/rule?">${saved.r}</textarea></div>
    <div class="form-row"><label>A — Application</label><textarea id="irac-a" placeholder="Apply the rule to these specific facts.">${saved.a}</textarea></div>
    <div class="form-row"><label>C — Conclusion</label><textarea id="irac-c" placeholder="What's your conclusion/advice?">${saved.co}</textarea></div>
    <button class="btn btn-emerald" onclick="submitIRAC('${c.id}','${t.id}')">Save & see what a strong answer covers</button>
    <div id="iracFeedback"></div>
  </div>`;
}
function submitIRAC(cid,tid){
  const key=cid+'/'+tid;
  state.irac[key] = {
    i: document.getElementById('irac-i').value,
    r: document.getElementById('irac-r').value,
    a: document.getElementById('irac-a').value,
    co: document.getElementById('irac-c').value
  };
  state.progress.problemsAttempted[key]=true;
  persistState();
  const t = findTopic(cid,tid).topic;
  document.getElementById('iracFeedback').innerHTML = `
    <div class="ratio-box" style="margin-top:16px;">
      <div class="rl">A strong answer would cover</div>
      <ul style="margin-top:8px;">
        <li>Clearly frame the issue in one sentence before anything else.</li>
        <li>State the rule using the actual statute/section and at least one authority: ${t.cases.length? t.cases.map(cs=>cs.name).join(", ") : "the relevant case law"}.</li>
        <li>Apply the rule fact-by-fact — don't just restate the law, connect it to what happened in the scenario.</li>
        <li>Reach a clear, confident conclusion/advice — don't leave it hanging.</li>
      </ul>
    </div>`;
}

function topicQuizTab(c,t){
  const key = c.id+'/'+t.id;
  if(!state.quizState || state.quizState.key!==key){
    state.quizState = {key, i:0, score:0, answered:false, selected:null, finished:false};
  }
  const qs = t.quiz;
  if(qs.length===0) return `<div class="empty-state"><div class="ic">📝</div>No quiz yet for this topic.</div>`;
  const qsState = state.quizState;
  if(qsState.finished){
    state.progress.quizScores[key] = qsState.score+"/"+qs.length;
    persistState();
    return `<div class="card block" style="text-align:center;padding:40px;">
      <h4>Quiz complete</h4>
      <div style="font-family:'Fraunces',serif;font-size:2.4rem;color:var(--emerald-deep);">${qsState.score}/${qs.length}</div>
      <p>Weak areas: ${qsState.score===qs.length? "None — solid grasp of this topic." : "Revisit the Concept & Law tab and the case list above."}</p>
      <button class="btn btn-emerald" onclick="restartQuiz('${key}')">Try again</button>
      <button class="btn btn-outline" style="color:var(--ink);border-color:var(--paper-line);" onclick="nav('#/topic/${c.id}/${t.id}/next')">What next →</button>
    </div>`;
  }
  const q = qs[qsState.i];
  return `<div class="card block">
    <div class="tag-row"><span class="badge badge-sky">Question ${qsState.i+1} of ${qs.length}</span></div>
    <h4 style="text-transform:none;letter-spacing:0;font-size:1.02rem;color:var(--ink);">${q.q}</h4>
    <div style="margin-top:14px;">
      ${q.options.map((opt,idx)=>{
        let cls="q-option";
        if(qsState.answered){
          if(idx===q.a) cls+=" correct";
          else if(idx===qsState.selected) cls+=" wrong";
        }
        return `<button class="${cls}" ${qsState.answered?'disabled':''} onclick="answerQuiz(${idx})">${opt}</button>`;
      }).join("")}
    </div>
    ${qsState.answered? `<button class="btn btn-primary" style="margin-top:10px;" onclick="nextQuiz()">${qsState.i+1<qs.length? "Next question →":"See results →"}</button>` : ""}
  </div>`;
}
function answerQuiz(idx){
  const qs = state.quizState;
  const key = qs.key;
  const [cid,tid] = key.split('/');
  const t = findTopic(cid,tid).topic;
  const q = t.quiz[qs.i];
  qs.answered = true; qs.selected = idx;
  if(idx===q.a) qs.score++;
  render();
}
function nextQuiz(){
  const qs = state.quizState;
  const [cid,tid] = qs.key.split('/');
  const t = findTopic(cid,tid).topic;
  if(qs.i+1 < t.quiz.length){ qs.i++; qs.answered=false; qs.selected=null; }
  else { qs.finished = true; }
  render();
}
function restartQuiz(key){ state.quizState = {key, i:0, score:0, answered:false, selected:null, finished:false}; render(); }

function topicNextTab(c,t){
  const key = c.id+'/'+t.id;
  const done = !!state.progress.topicsCompleted[key];
  const idxInCourse = c.topics.findIndex(x=>x.id===t.id);
  const nextTopic = c.topics[idxInCourse+1];
  return `<div class="next-block">
    <h4>You've finished this topic. What should you do next?</h4>
    <div class="checklist">
      <label><input type="checkbox" onchange="nav('#/topic/${c.id}/${t.id}/cases')"> Review the cases</label>
      <label><input type="checkbox" onchange="nav('#/topic/${c.id}/${t.id}/flashcards')"> Test yourself with flashcards</label>
      <label><input type="checkbox" onchange="nav('#/topic/${c.id}/${t.id}/problem')"> Attempt the problem question</label>
      <label><input type="checkbox" onchange="nav('#/topic/${c.id}/${t.id}/quiz')"> Take the quiz</label>
      <label><input type="checkbox" onchange="nav('#/topic/${c.id}/${t.id}/concept')"> Review the relevant statute</label>
      <label><input type="checkbox" onchange="nav('#/exam')"> Try Exam Mode</label>

    <div class="next-recs">
      <button class="pill-btn" onclick="markComplete('${c.id}','${t.id}')">${done? '✓ Marked complete':'Mark topic complete'}</button>
      ${nextTopic? `<button class="pill-btn ghost" style="color:#fff;" onclick="nav('#/topic/${c.id}/${nextTopic.id}/concept')">Next topic: ${nextTopic.title} →</button>` : `<button class="pill-btn ghost" style="color:#fff;" onclick="nav('#/course/${c.id}')">Back to course →</button>`}
    </div>
  </div>`;
}
function markComplete(cid,tid){
  const key=cid+'/'+tid;
  state.progress.topicsCompleted[key]=true;

  render();

const CAREER_QUIZ_QS = [

function viewCareerQuiz(){
  if(!state.careerQuizState) state.careerQuizState={i:0, scores:{}, answers:[]};
  const s = state.careerQuizState;
  if(s.i >= CAREER_QUIZ_QS.length){
    const ranked = Object.entries(s.scores).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return `<div class="section"><div class="wrap" style="max-width:560px;">
      <h2>Your top matches</h2>
      <div class="folder-grid" style="margin-top:16px;">
        ${ranked.map(([id],i)=>{ const c=CAREERS.find(x=>x.id===id); return `<div class="folder" onclick="nav('#/career/${id}')"><div style="font-size:1.4rem;">${c.ic}</div><h3>#${i+1} ${c.name}</h3></div>`; }).join("")}
      </div>
      <button class="btn btn-outline" style="color:var(--ink);border-color:var(--paper-line);margin-top:20px;" onclick="state.careerQuizState=null;render();">Retake quiz</button>
    </div></div>`;
  }
  const q = CAREER_QUIZ_QS[s.i];
  return `<div class="section"><div class="wrap" style="max-width:560px;">
    <div class="kicker">Career quiz · ${s.i+1} of ${CAREER_QUIZ_QS.length}</div>
    <h2 style="font-size:1.4rem;">${q.q}</h2>
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button class="btn btn-emerald" onclick="answerCareerQuiz(true)">Yes</button>

    </div>

}
function answerCareerQuiz(yes){
  const s = state.careerQuizState;
  const q = CAREER_QUIZ_QS[s.i];
  if(yes){ Object.entries(q.tags).forEach(([id,w])=>{ s.scores[id]=(s.scores[id]||0)+w; }); }
  s.i++;
  render();
}

function doSearch(q){ state.searchQuery = q; nav("#/search"); }
function viewSearch(){
  const q = (state.searchQuery||"").trim().toLowerCase();
  if(!q) return `<div class="section"><div class="wrap"><div class="empty-state"><div class="ic">🔎</div>Type something into the search bar above to search courses, cases, statutes, maxims, careers, internships, law firms and news.</div></div></div>`;
  const results = {topics:[], cases:[], maxims:[], careers:[], firms:[], internships:[], news:[]};
  COURSES.forEach(c=>c.topics.forEach(t=>{
    if((t.title+t.concept).toLowerCase().includes(q)) results.topics.push({c,t});
    t.cases.forEach(cs=>{ if((cs.name+cs.principle).toLowerCase().includes(q)) results.cases.push({c,t,cs}); });
  }));
  LATIN.forEach(m=>{ if((m.m+m.plain+m.area).toLowerCase().includes(q)) results.maxims.push(m); });
  CAREERS.forEach(c=>{ if((c.name+c.what).toLowerCase().includes(q)) results.careers.push(c); });
  LAW_FIRMS_DEMO.forEach(f=>{ if((f.name+f.areas).toLowerCase().includes(q)) results.firms.push(f); });
  INTERNSHIPS_DEMO.forEach(o=>{ if((o.role+o.org+o.area).toLowerCase().includes(q)) results.internships.push(o); });
  NEWS_DEMO.forEach(n=>{ if((n.headline+n.area).toLowerCase().includes(q)) results.news.push(n); });

  const groups = [
   ["Courses & Topics", results.topics.map(r=>({title:r.t.title, sub:r.c.name, go:()=>`#/topic/${r.c.id}/${r.t.id}/concept`}))],
   ["Cases", results.cases.map(r=>({title:r.cs.name, sub:r.c.name+" · "+r.t.title, go:()=>`#/case/${r.cs.id}`}))],
   ["Latin Maxims", results.maxims.map(m=>({title:m.m, sub:m.area, go:()=>`#/maxims`}))],
   ["Careers", results.careers.map(c=>({title:c.name, sub:"Career area", go:()=>`#/career/${c.id}`}))],
   ["Law Firms", results.firms.map(f=>({title:f.name, sub:f.areas, go:()=>`#/firms`}))],
   ["Internships", results.internships.map(o=>({title:o.role, sub:o.org, go:()=>`#/internships`}))],
   ["Nigerian Law Today", results.news.map(n=>({title:n.headline, sub:n.area, go:()=>`#/news`}))]
  ].filter(([_,arr])=>arr.length>0);

  return `<div class="section"><div class="wrap">
    <div class="kicker">Search results</div>
    <h2>"${q}"</h2>
    ${groups.length===0? `<div class="empty-state"><div class="ic">🕳️</div>Nothing matched. Try a different term, e.g. "estoppel", "internship" or "oil and gas".</div>` :
      groups.map(([label,items])=>`<div class="search-results-group"><h3>${label}</h3>
        ${items.map(it=>`<div class="result-row" onclick="nav('${it.go()}')"><div class="rtitle">${it.title}</div><div class="rsub">${it.sub}</div></div>`).join("")}
      </div>`).join("")}
  </div></div>`;
}

async function submitAdminTopic(){
  captureAdminForm();
  const af = state.adminForm;
  if(!af.title.trim()){ af.message="Please give the topic a title."; af.messageOk=false; render(); return; }
  if(!sb){ af.message="Supabase isn't configured — can't publish."; af.messageOk=false; render(); return; }
  af.uploading = true; af.message=""; render();
  try{
    let videoUrl = null;
    const fileInput = document.getElementById('adm-video-file');
    if(fileInput && fileInput.files && fileInput.files[0]){
      const file = fileInput.files[0];
      const path = Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
      const { error: upErr } = await sb.storage.from('videos').upload(path, file);
      if(upErr) throw upErr;
      const { data: pub } = sb.storage.from('videos').getPublicUrl(path);
      videoUrl = pub.publicUrl;
    }
    const { data:{ user } } = await sb.auth.getUser();
    const payload = {
      course_id: af.courseId,
      title: af.title.trim(),
      concept: af.concept.trim(),
      law: af.lawText.split("\n").map(s=>s.trim()).filter(Boolean),
      statute: af.statute.trim(),
      cases: af.cases.filter(c=>c.name.trim()).map(c=>({name:c.name,court:c.court,year:"—",facts:c.facts,issue:c.issue,decision:c.decision,ratio:c.ratio,obiter:"",principle:c.ratio,examUse:c.ratio})),
      flashcards: af.flashcards.filter(f=>f.f.trim()&&f.b.trim()),
      quiz: af.quiz.filter(q=>q.q.trim()).map(q=>({q:q.q, options:[q.o1,q.o2,q.o3,q.o4], a:q.correct})),
      problem_scenario: af.problemScenario.trim() || null,
      problem_ask: af.problemAsk.trim() || null,
      video_url: videoUrl,
      video_title: af.videoTitle.trim() || null,
      created_by: user? user.id : null
    };
    const { error } = await sb.from('admin_topics').insert(payload);
    if(error) throw error;
    await loadAdminTopics();
    state.adminForm = blankAdminForm();
    state.adminForm.message = "Published. Students will see it next time they load the app.";
    state.adminForm.messageOk = true;
  }catch(e){
    af.uploading = false;
    af.message = e.message || "Something went wrong publishing this topic.";
    af.messageOk = false;
  }
  render();
}
async function deleteAdminTopic(id){
  if(!confirm("Delete this topic for everyone?")) return;
  if(!sb) return;
  await sb.from('admin_topics').delete().eq('id', id);
  await loadAdminTopics();
  render();
}

  }
  if(es.finished){
    return `<div class="section"><div class="wrap" style="max-width:520px;text-align:center;">
      <h2>Exam complete</h2>
      <div style="font-family:'Fraunces',serif;font-size:3rem;color:var(--emerald-deep);">${es.score}/${es.questions.length}</div>
      <p>Suggested revision: revisit the topics behind any question you missed, then retake the topic quiz.</p>
      <button class="btn btn-emerald" onclick="state.examState={setup:true};render();">Set up another exam</button>
    </div></div>`;
  }
  const q = es.questions[es.i];
  const remain = es.timeLeft;
  return `<div class="section"><div class="wrap" style="max-width:640px;">
    <div class="tag-row" style="justify-content:space-between;display:flex;"><span class="badge badge-sky">Question ${es.i+1} of ${es.questions.length}</span><span class="timer-badge">⏱ ${Math.floor(remain/60)}:${(remain%60).toString().padStart(2,'0')}</span></div>
    <div class="card block"><h4 style="text-transform:none;letter-spacing:0;font-size:1.02rem;color:var(--ink);">${q.q}</h4>
      <div style="margin-top:14px;">
        ${q.options.map((opt,idx)=>{
          let cls="q-option";
          if(es.answered){ if(idx===q.a) cls+=" correct"; else if(idx===es.selected) cls+=" wrong"; }
          return `<button class="${cls}" ${es.answered?'disabled':''} onclick="examAnswer(${idx})">${opt}</button>`;
        }).join("")}
      </div>
      ${es.answered? `<button class="btn btn-primary" style="margin-top:10px;" onclick="examNext()">${es.i+1<es.questions.length?'Next →':'Finish →'}</button>`:''}
    </div>
  </div></div>`;
}
let examTimerHandle=null;
function startExam(){
  const cid = document.getElementById('ex-course').value;
  const count = parseInt(document.getElementById('ex-count').value,10);
  const c = COURSES.find(x=>x.id===cid);
  let pool=[];
  c.topics.forEach(t=>t.quiz.forEach(q=>pool.push(q)));
  pool = pool.sort(()=>Math.random()-0.5).slice(0,Math.min(count,pool.length));
  state.examState = {setup:false, finished:false, questions:pool, i:0, score:0, answered:false, selected:null, timeLeft: pool.length*45};
  clearInterval(examTimerHandle);
  examTimerHandle = setInterval(()=>{
    if(!state.examState || state.examState.finished){ clearInterval(examTimerHandle); return; }
    state.examState.timeLeft--;
    if(state.examState.timeLeft<=0){ state.examState.finished=true; clearInterval(examTimerHandle); }
    render();
  },1000);
  render();
}
function examAnswer(idx){
  const es = state.examState;
  es.answered=true; es.selected=idx;
  if(idx===es.questions[es.i].a) es.score++;
  render();
}
function examNext(){
  const es = state.examState;
  if(es.i+1<es.questions.length){ es.i++; es.answered=false; es.selected=null; }
  else { es.finished=true; clearInterval(examTimerHandle); state.progress.examScores.push(es.score+"/"+es.questions.length); persistState(); }
  render();
}

/* ---------------- WIRING ---------------- */
function wireGlobalEvents(){
  // render case overlay on top if route is a case route
  const existing = document.getElementById("caseOverlay");
  if(existing) existing.remove();
  if(state.route.startsWith("#/case/")){
    const div = document.createElement("div");
    div.id = "caseOverlay";
    div.innerHTML = viewCaseOverlay();
    document.body.appendChild(div);
  }
}

/* ---------------- INIT ---------------- */
async function bootstrap(){
  if(sb){
    try{
      const { data:{ session } } = await sb.auth.getSession();
      if(session){
        await loadProfileFromDB();
        await loadProgressFromDB();
        await loadUserContentFromDB();
      }
      await loadAdminTopics();
    }catch(e){ console.error("LawPhaser session check failed:", e); }
  }
  state.route = location.hash || "#/";
  render();
}
bootstrap();
</script>
